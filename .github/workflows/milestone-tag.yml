name: milestone-tag
# Tags are created deliberately: add a line "<tag> <message>" to MILESTONES and push.
on:
  push:
    branches: [main]
    paths: [MILESTONES]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create missing milestone tags at this commit
        run: |
          git config user.name "zb-bot"; git config user.email "zb-bot@users.noreply.github.com"
          while read -r tag msg; do
            case "$tag" in ''|\#*) continue;; esac
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null && continue
            git tag -a "$tag" -m "${msg:-$tag}" && git push origin "$tag"
          done < MILESTONES
